<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ガソリン代ルート比較</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>ガソリン代ルート比較</h1>
  </header>

  <p id="banner" class="banner" hidden role="alert"></p>

  <main>
    <!-- 1. 入力欄 -->
    <section class="card">
      <form id="input-form" novalidate>
        <label>出発地
          <input type="text" id="origin" placeholder="例：東京駅" autocomplete="off">
          <div id="origin-suggestions" class="suggestions" hidden></div>
          <span id="origin-error" class="field-error" hidden></span>
        </label>
        <label>目的地
          <input type="text" id="destination" placeholder="例：横浜駅" autocomplete="off">
          <div id="destination-suggestions" class="suggestions" hidden></div>
          <span id="destination-error" class="field-error" hidden></span>
        </label>
        <div class="row">
          <label>燃費（km/L）
            <input type="number" id="efficiency" step="0.1" min="0" inputmode="decimal" placeholder="例：15">
            <span id="efficiency-error" class="field-error" hidden></span>
          </label>
          <label>単価（円/L）
            <input type="number" id="price" step="1" min="0" inputmode="decimal" placeholder="例：170">
            <span id="price-error" class="field-error" hidden></span>
          </label>
        </div>
        <button type="submit" id="calc-button">計算</button>
      </form>
      <p id="hint" class="hint" hidden></p>
    </section>

    <!-- 2. 地名候補の一覧 -->
    <section id="candidates" class="card" hidden>
      <h2>地名の候補を選んでください</h2>
      <div id="origin-candidates"></div>
      <div id="destination-candidates"></div>
    </section>

    <!-- 3. 地図 -->
    <section class="card">
      <div id="map-wrap">
        <div id="map"></div>
        <div id="map-overlay" class="map-overlay" hidden>
          <div class="spinner" aria-hidden="true"></div>
          <p id="map-overlay-text"></p>
        </div>
      </div>
    </section>

    <!-- 4. 比較（カード表示） -->
    <section id="result" class="card" hidden>
      <h2>ルート比較</h2>
      <p id="suggestion" class="suggestion"></p>
      <div id="route-cards" class="route-cards"></div>
    </section>
  </main>

  <footer>
    地図 © OpenStreetMap contributors ／ 地名検索 Nominatim ／ ルート検索 OSRM
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
